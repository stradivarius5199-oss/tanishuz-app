version: '3.9'

services:
  # PostgreSQL — база данных
  postgres:
    image: postgres:16-alpine
    container_name: sparks-uz-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sparks
      POSTGRES_PASSWORD: sparks_secret
      POSTGRES_DB: sparks_uz
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # pgAdmin — визуальный интерфейс для БД (опционально)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: sparks-uz-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@sparks.uz
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    depends_on:
      - postgres

volumes:
  postgres_data:
